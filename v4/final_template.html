<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Prevent browser caching - always fetch fresh content -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>[[OG_TITLE]]</title>

    <!-- Open Graph for WhatsApp/Social Preview -->
    <meta property="og:title" content="[[OG_TITLE]]">
    <meta property="og:description" content="Clique para ver o convite interativo!">
    <meta property="og:image" content="[[CAPA_URL]]">
    <meta property="og:type" content="website">

    <!-- Envelope Favicon -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><path d='M64 112c-8.8 0-16 7.2-16 16v22.1L220.5 291.7c20.7 17 50.4 17 71.1 0L464 150.1V128c0-8.8-7.2-16-16-16H64zM48 212.2V384c0 8.8 7.2 16 16 16H448c8.8 0 16-7.2 16-16V212.2L322 328.8c-38.4 31.5-93.7 31.5-132 0L48 212.2zM0 128C0 92.7 28.7 64 64 64H448c35.3 0 64 28.7 64 64V384c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V128z'/></svg>">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            background-color: #000;
        }

        /* Utilitários de Transição e Camadas */
        .camada {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.8s ease-in-out;
        }

        /* Contorno Cinza no Texto (Stroke) */
        .texto-capa {
            color: white;
            text-shadow:
                -1px -1px 0 #555,
                1px -1px 0 #555,
                -1px 1px 0 #555,
                1px 1px 0 #555;
            /* Simula contorno cinza */
        }

        /* Animação da Mãozinha */
        @keyframes clicando {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(0.9);
            }
        }

        .animar-clique {
            animation: clicando 1.5s infinite ease-in-out;
        }

        /* Classes de Estado */
        .invisivel {
            opacity: 0;
            pointer-events: none;
        }

        .visivel {
            opacity: 1;
            pointer-events: auto;
        }

        /* Popup Manual */
        #popupManual {
            transition: opacity 0.3s ease-in-out;
        }

        .blur-background {
            filter: blur(5px) brightness(0.5);
        }

        /* Sombra suave para o cronômetro */
        .texto-sombra {
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.8);
        }

        /* =========================================
           SCENARIOS CSS (Injected via Render Mode)
           ========================================= */

        /* Scenario A: Direct Mode (No Cover, No Intro) */
        .mode-direct #capaInicial {
            background-image: none !important;
            background-color: rgba(0, 0, 0, 0.4);
            /* Slight darken for text readability */
        }

        .mode-direct #capaInicial .bg-black\/20 {
            display: none;
        }

        /* Show content immediately behind */
        .mode-direct #fundoTelaImg,
        .mode-direct #fundoTelaVideo,
        .mode-direct #containerBotoes,
        .mode-direct #containerShadow {
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        .mode-direct #videoAbertura {
            display: none !important;
        }

        /* Scenario C: Transparent Cover (Intro as Cover) */
        .mode-transparent #capaInicial {
            background-image: none !important;
            background-color: transparent !important;
        }

        .mode-transparent #capaInicial .bg-black\/20 {
            display: none;
        }
    </style>
    <style>
        :root {
            --button-color: [[BUTTON_COLOR]];
        }

        .custom-button-bg {
            background-color: var(--button-color) !important;
        }
    </style>
</head>

    <script>
        // ==========================================
        // ROBUST VIDEO LOADING (Network Resilience)
        // ==========================================
        function setupRobustVideo(videoElement) {
            if (!videoElement) return;

            // Ensure attributes for maximum compatibility
            videoElement.setAttribute('playsinline', '');
            videoElement.setAttribute('webkit-playsinline', '');
            videoElement.setAttribute('preload', 'auto');

            let stuckTimer = null;
            let lastTime = -1;

            const attemptResume = () => {
                console.log('[Video] Attempting resume/reload...');
                if (videoElement.paused) videoElement.play().catch(() => { });
            };

            // Monitor stalled/waiting states
            videoElement.addEventListener('waiting', () => {
                console.log('[Video] Waiting for data...');
                // If waiting too long (e.g. 5s), try to nudge it
                clearTimeout(stuckTimer);
                stuckTimer = setTimeout(attemptResume, 5000);
            });

            videoElement.addEventListener('stalled', () => {
                console.log('[Video] Stalled (Low bandwidth).');
            });

            videoElement.addEventListener('playing', () => {
                clearTimeout(stuckTimer);
                console.log('[Video] Playing.');
            });

            videoElement.addEventListener('error', (e) => {
                console.error('[Video] Error:', videoElement.error);
                // Fatal error prevention
                setTimeout(() => {
                    console.log('[Video] Retrying load...');
                    videoElement.load();
                    videoElement.play().catch(e => console.log('Retry play failed', e));
                }, 3000);
            });

            // Watchdog for Frozen Video
            setInterval(() => {
                if (!videoElement.paused && !videoElement.ended && videoElement.readyState > 2) {
                    if (videoElement.currentTime === lastTime) {
                        console.log('[Video] Freeze detected. Nudging...');
                    }
                    lastTime = videoElement.currentTime;
                }
            }, 2000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const videos = document.querySelectorAll('video');
            videos.forEach(setupRobustVideo);

            // Also watch for dynamic videos
            const observer = new MutationObserver((mutations) => {
                mutations.forEach(m => {
                    m.addedNodes.forEach(node => {
                        if (node.nodeName === 'VIDEO') setupRobustVideo(node);
                        if (node.querySelectorAll) node.querySelectorAll('video').forEach(setupRobustVideo);
                    });
                });
            });
            observer.observe(document.body, { childList: true, subtree: true });
        });

        // ==================================================================
        // 0. RENDER MODE & SCENARIO LOGIC
        // ==================================================================
        const renderMode = '[[RENDER_MODE]]'; // standard, direct, transparent-cover
        console.log('[AutoBuilder] Render Mode:', renderMode);

        if (renderMode === 'direct') {
            document.body.classList.add('mode-direct');
            const icon = document.querySelector('#dicaInteractionContainer i');
            const text = document.querySelector('#dicaInteractionContainer h1');
            // Change to Music Hint
            if (icon) icon.className = "fa-solid fa-music text-5xl text-white drop-shadow-lg animar-clique";
            if (text) text.innerText = "Clique para tocar a música!";
        } else if (renderMode === 'transparent-cover') {
            document.body.classList.add('mode-transparent');
        }

        // ==================================================================
        // 1. CONFIGURAÇÃO DOS BOTÕES (Injetado pelo AutoBuilder)
        // ==================================================================
        const menuConfig = [[MENU_CONFIG]];
        // Injected by AutoBuilder
        const buttonSize = parseFloat('[[BUTTON_SIZE]]') || 1.0;

        // ==================================================================
        // 2. REFERÊNCIAS DO DOM
        // ==================================================================
        const capa = document.getElementById('capaInicial');
        const videoAbertura = document.getElementById('videoAbertura');
        const fundoTelaVideo = document.getElementById('fundoTelaVideo');
        const fundoTelaImg = document.getElementById('fundoTelaImg');
        const audio = document.getElementById('musicaFundo');
        const btnPular = document.getElementById('btnPular');
        const btnMute = document.getElementById('btnMute');
        const iconMute = document.getElementById('iconMute');
        const containerBotoes = document.getElementById('containerBotoes');
        const containerShadow = document.getElementById('containerShadow');
        const gridBotoes = document.getElementById('gridBotoes');

        // Popup Refs
        const popupManual = document.getElementById('popupManual');
        const btnCloseManual = document.getElementById('btnCloseManual');
        const manualContent = document.getElementById('manualContent');

        const popupPresentes = document.getElementById('popupPresentes');
        const btnClosePresentes = document.getElementById('btnClosePresentes');

        // Popup RSVP Refs
        const popupRSVP = document.getElementById('popupRSVP');
        const btnCloseRSVP = document.getElementById('btnCloseRSVP');
        const inputName = document.getElementById('rsvp-name');
        const inputPhone = document.getElementById('rsvp-phone');
        const txtAcompCount = document.getElementById('txt-acomp-count');
        const checkNoAcomp = document.getElementById('check-no-acomp');
        const btnConfirmRSVP = document.getElementById('btn-confirm-rsvp');
        let currentRSVPNumber = "";
        let acompCount = 0;

        let transicaoFeita = false;
        let estaMutado = false;
        let iniciouInteracao = false;

        // Timer Ref
        const countdownContainer = document.getElementById('countdownContainer');

        // ==================================================================
        // 7. LÓGICA DO POPUP MANUAL (DEFINIDO ANTES PARA USAR NO LOOP)
        // ==================================================================
        window.abrirManual = function (e) {
            e.preventDefault();
            popupManual.classList.remove('invisivel');
        }

        btnCloseManual.addEventListener('click', () => {
            popupManual.classList.add('invisivel');
        });

        // Fechar ao clicar fora
        popupManual.addEventListener('click', (e) => {
            if (e.target === popupManual) {
                popupManual.classList.add('invisivel');
            }
        });

        // ==================================================================
        // 8. LÓGICA DO POPUP PRESENTES (DEFINIDO ANTES PARA USAR NO LOOP)
        // ==================================================================
        window.abrirPresentes = function (e) {
            e.preventDefault();
            popupPresentes.classList.remove('invisivel');
        }

        btnClosePresentes.addEventListener('click', () => {
            popupPresentes.classList.add('invisivel');
        });

        popupPresentes.addEventListener('click', (e) => {
            if (e.target === popupPresentes) {
                popupPresentes.classList.add('invisivel');
            }
        });

        // ==================================================================
        // 8.5. LÓGICA DO POPUP IMAGEM MANUAL
        // ==================================================================
        const popupManualImage = document.getElementById('popupManualImage');
        const btnCloseManualImage = document.getElementById('btnCloseManualImage');

        window.abrirManualImage = function (e) {
            e.preventDefault();
            popupManualImage.classList.remove('invisivel');
        }

        if (btnCloseManualImage) {
            btnCloseManualImage.addEventListener('click', () => {
                popupManualImage.classList.add('invisivel');
            });
        }

        if (popupManualImage) {
            popupManualImage.addEventListener('click', (e) => {
                if (e.target === popupManualImage) {
                    popupManualImage.classList.add('invisivel');
                }
            });
        }

        // ==================================================================
        // 9. LÓGICA DO POPUP RSVP (CONFIRMAÇÃO)
        // ==================================================================

        // Counter Logic
        document.getElementById('btn-dec-acomp').addEventListener('click', () => {
            if (acompCount > 0) { acompCount--; txtAcompCount.textContent = acompCount; }
        });
        document.getElementById('btn-inc-acomp').addEventListener('click', () => {
            acompCount++; txtAcompCount.textContent = acompCount;
        });

        // Checkbox Logic
        checkNoAcomp.addEventListener('change', (e) => {
            const container = document.getElementById('container-acompanhantes');
            if (e.target.checked) {
                container.classList.add('hidden');
                acompCount = 0;
            } else {
                container.classList.remove('hidden');
            }
        });

        // Injected State for Logic
        const companionHideClass = "[[COMPANION_HIDE_CLASS]]";

        window.abrirRSVP = function (e, link) {
            e.preventDefault();

            // SIMPLIFIED LOGIC: Any URL opens directly, only raw phone numbers use popup
            const isUrl = link.startsWith("http");

            if (isUrl) {
                // ANY URL (forms, group chats, wedding sites, etc) opens directly
                window.open(link, '_blank');
                return;
            }

            // It is a phone (either raw digits or wa.me link)
            // Extract just digits
            currentRSVPNumber = link.replace(/\D/g, '');

            // Reset Form
            inputName.value = "";
            inputPhone.value = "";
            acompCount = 0;
            txtAcompCount.textContent = "0";
            checkNoAcomp.checked = false;

            // Visibility Logic: Respect Global Settings
            const containerAcomp = document.getElementById('container-acompanhantes');
            const checkContainer = document.getElementById('check-no-acomp').parentElement;

            if (companionHideClass.includes('hidden')) {
                // Feature Disabled globally
                containerAcomp.classList.add('hidden');
                checkContainer.classList.add('hidden');
            } else {
                // Feature Enabled
                containerAcomp.classList.remove('hidden');
                checkContainer.classList.remove('hidden');
            }

            popupRSVP.classList.remove('invisivel');
        }

        // Close Logic
        btnCloseRSVP.addEventListener('click', () => popupRSVP.classList.add('invisivel'));
        popupRSVP.addEventListener('click', (e) => {
            if (e.target === popupRSVP) popupRSVP.classList.add('invisivel');
        });

        // Send Logic
        btnConfirmRSVP.addEventListener('click', () => {
            const name = inputName.value.trim();
            const phone = inputPhone.value.trim();

            if (!name || !phone) {
                alert("Por favor, preencha Nome e WhatsApp.");
                return;
            }

            let message = `Olá! Gostaria de confirmar minha presença.\n\n*Nome:* ${name}\n*Telefone:* ${phone}`;

            // Only include companion info if feature is enabled
            if (!companionHideClass.includes('hidden')) {
                if (!checkNoAcomp.checked) {
                    if (acompCount > 0) {
                        message += `\n*Acompanhantes:* ${acompCount}`;
                    } else {
                        message += `\n*Acompanhantes:* Nenhum`;
                    }
                } else {
                    message += `\n*Acompanhantes:* Nenhum (Vou sozinho)`;
                }
            }

            const waUrl = `https://wa.me/${currentRSVPNumber}?text=${encodeURIComponent(message)}`;
            window.open(waUrl, '_blank');

            popupRSVP.classList.add('invisivel');
        });

        // ==================================================================
        // 3. GERAR BOTÕES DINAMICAMENTE
        // ==================================================================
        console.log("[AutoBuilder] Rendering Buttons:", menuConfig);

        // 1. Filtrar botões ativos primeiro para saber a quantidade exata e configurar o container
        const activeButtons = menuConfig.filter(btn => {
            // Robust check: Ensure link exists OR it's a special image button
            // Treat '#' as a valid link
            const hasLink = btn.link !== undefined && btn.link !== null && String(btn.link).trim() !== "";
            // Special check for Manual Text mode (which uses manualText prop instead of link)
            const hasManualText = btn.id === 'manual' && btn.manualText && btn.manualText.length > 0;

            return hasLink || btn.isGiftImage || btn.isManualImage || hasManualText;
        });

        const btnCount = activeButtons.length;

        // 2. Definir classes do Container baseadas na quantidade (Lógica de Auto-Ajuste)
        // 2. Definir classes do Container baseadas na quantidade (Lógica de Auto-Ajuste)
        let gridClasses = "";

        if (btnCount <= 4) {
            // V4.1: Use Flexbox for better centering spacing when few buttons exist
            // gap-2 matches the preview spacing exactly
            gridClasses = "flex flex-row justify-center items-start transition-all duration-300 gap-2";
        } else {
            // Use Grid for 5+ to guarantee equal distribution/squeezing
            gridClasses = "grid grid-flow-col auto-cols-fr w-full max-w-[480px] place-items-start transition-all duration-300";

            if (btnCount === 5) {
                gridClasses += " gap-2 scale-95 origin-bottom"; // Aperta um pouco
            } else {
                // 6 ou mais botões
                gridClasses += " gap-1 scale-90 origin-bottom"; // Aperta mais e reduz tamanho
            }
        }

        // Aplica as classes ao grid
        if (gridBotoes) {
            gridBotoes.className = gridClasses;
        }

        // 3. Gerar os botões (Loop na lista filtrada)
        activeButtons.forEach(btn => {
            const isGiftImage = btn.isGiftImage === true;
            const isManualImage = btn.isManualImage === true;

            console.log(`[AutoBuilder] Rendering Button: ${btn.id}`);

            // Create anchor element
            const anchor = document.createElement('a');
            // 'min-w-0' é crucial para permitir encolhimento em linhas cheias (grid)
            // 'w-full' garante que ele ocupe o centro da sua fração do grid
            anchor.className = "group flex flex-col items-center gap-1 focus:outline-none w-full min-w-0 cursor-pointer";

            // Logic for href/click (Mantendo a lógica original funcional)
            anchor.target = "_blank"; // Default

            const isRSVP = btn.titulo.toLowerCase().includes("confirmar") || btn.titulo.toLowerCase().includes("presença");

            if (btn.id === 'manual') {
                // Manual Handler (Image or Text)
                anchor.href = "#";
                anchor.removeAttribute('target');
                if (isManualImage) {
                    anchor.addEventListener('click', abrirManualImage);
                } else {
                    anchor.addEventListener('click', abrirManual);
                }

                // Se for manual text, injeta o conteúdo
                if (btn.manualText && manualContent) {
                    manualContent.innerHTML = btn.manualText;
                }
            } else if (isGiftImage) {
                anchor.href = "#";
                anchor.removeAttribute('target');
                anchor.addEventListener('click', abrirPresentes);
            } else if (isRSVP) {
                // Smart RSVP Logic
                anchor.href = "#";
                anchor.removeAttribute('target'); // RSVP popup is internal
                anchor.addEventListener('click', (e) => abrirRSVP(e, btn.link));
            } else {
                anchor.href = btn.link;
            }

            // Calculate sizes (Mantendo a escala configurada)
            const basePx = 48;
            const sizePx = basePx * buttonSize;
            const baseIconRem = 1.125;
            const iconRem = baseIconRem * buttonSize;

            // Renderização do HTML interno
            anchor.innerHTML = `
                <div class="rounded-full border border-stone-300 p-[2px] transition-transform duration-300 group-hover:scale-105 group-active:scale-95">
                    <div class="rounded-full custom-button-bg text-white flex items-center justify-center shadow-lg group-hover:bg-stone-700 transition-colors"
                         style="width: ${sizePx}px; height: ${sizePx}px; background-color: #751a1a;">
                        <i class="${btn.icone}" style="font-size: ${iconRem}rem;"></i>
                    </div>
                </div>
                <span class="text-[10px] uppercase font-bold text-white tracking-wide text-center leading-tight drop-shadow-md w-full break-words px-1">
                    ${btn.titulo}
                </span>
            `;

            gridBotoes.appendChild(anchor);
        });

        // ==================================================================
        // 4. LÓGICA DE INÍCIO - INICIA AMBOS OS VÍDEOS NO MESMO GESTO
        // ==================================================================

        capa.addEventListener('click', function () {
            if (iniciouInteracao) return;
            iniciouInteracao = true;

            // Esconde a capa
            capa.classList.add('invisivel');

            // Inicia a música (loop infinito)
            if (audio) {
                audio.volume = 0.5;
                audio.currentTime = 0;
                // Force reload to bypass weird caching glitches
                audio.load();

                var playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(_ => {
                        console.log("Audio started playing successfully");
                    })
                        .catch(error => {
                            console.error("Audio playback failed:", error);
                            // Retry once on interaction
                            setTimeout(() => audio.play(), 500);
                        });
                }
            }

            // SOLUÇÃO iOS: Inicia vídeo de fundo no mesmo gesto do usuário
            // O fundo fica tocando na camada de trás, invisível por enquanto
            if (fundoTelaVideo) {
                fundoTelaVideo.muted = true;
                fundoTelaVideo.play().catch(function (e) { console.log("Fundo video not used or play failed"); });
            }

            // SCENARIO SPECIFIC LOGIC
            if (renderMode === 'direct') {
                // Skip Intro entirely -> Go to Loop State directly
                irParaLoop();
            } else {
                // Standard or Transparent-Cover Mode -> Play Intro
                // Vídeo de abertura na camada da frente
                if (videoAbertura) {
                    videoAbertura.currentTime = 0;
                    videoAbertura.play().catch(function (e) { console.error("Intro play failed:", e); });
                }
            }

            // Mostra controles
            btnPular.classList.remove('invisivel');
            btnMute.classList.remove('invisivel');
        });

        // ==================================================================
        // 5. LÓGICA DE TRANSIÇÃO PARA O LOOP
        // ==================================================================

        function irParaLoop() {
            if (transicaoFeita) return;
            transicaoFeita = true;

            // Esconde botão pular
            btnPular.classList.add('invisivel');

            // Mostra o fundo unificado (imagem ou vídeo)
            fundoTelaImg?.classList.remove('invisivel');
            fundoTelaVideo?.classList.remove('invisivel');
            videoAbertura.classList.add('invisivel');
            containerBotoes.classList.remove('invisivel');
            containerShadow.classList.remove('invisivel');

            // Mostra o timer apenas se não estiver hidden (timer ativado)
            if (countdownContainer && !countdownContainer.classList.contains('hidden')) {
                countdownContainer.classList.remove('invisivel');
            }

            // Pausa o vídeo de abertura após a transição visual
            setTimeout(function () { videoAbertura.pause(); }, 800);
        }

        // Gatilho 1: Quando o vídeo termina
        videoAbertura.onended = irParaLoop;

        // Gatilho 2: Pouco antes do vídeo terminar (transição suave)
        videoAbertura.ontimeupdate = function () {
            if (videoAbertura.duration > 0 &&
                videoAbertura.currentTime >= videoAbertura.duration - 0.5) {
                irParaLoop();
            }
        };

        // Gatilho 3: Botão pular
        btnPular.onclick = irParaLoop;

        // ==================================================================
        // 6. CONTROLE DE MUTE
        // ==================================================================
        btnMute.addEventListener('click', () => {
            estaMutado = !estaMutado;
            if (estaMutado) {
                audio.muted = true;
                videoAbertura.muted = true;
                if (fundoTelaVideo) fundoTelaVideo.muted = true;
                iconMute.className = "fa-solid fa-volume-xmark";
                btnMute.classList.add("bg-red-500/50");
            } else {
                audio.muted = false;
                if (!transicaoFeita) videoAbertura.muted = false;
                iconMute.className = "fa-solid fa-volume-high";
                btnMute.classList.remove("bg-red-500/50");
            }
        });

        // ==================================================================
        // TIMER DE CONTAGEM REGRESSIVA
        // ==================================================================
        function atualizarCronometro() {
            const dataAlvo = new Date('[[EVENT_DATETIME]]');
            const agora = new Date();

            let diferenca = dataAlvo - agora;

            if (diferenca <= 0 || isNaN(dataAlvo.getTime())) {
                document.getElementById('contadorMeses').innerText = "00";
                document.getElementById('contadorDias').innerText = "00";
                document.getElementById('contadorHoras').innerText = "00";
                document.getElementById('contadorMinutos').innerText = "00";
                document.getElementById('contadorSegundos').innerText = "00";
                return;
            }

            let anos = dataAlvo.getFullYear() - agora.getFullYear();
            let meses = dataAlvo.getMonth() - agora.getMonth();
            let dias = dataAlvo.getDate() - agora.getDate();
            let horas = dataAlvo.getHours() - agora.getHours();
            let minutos = dataAlvo.getMinutes() - agora.getMinutes();

            if (minutos < 0) { minutos += 60; horas--; }
            if (horas < 0) { horas += 24; dias--; }
            if (dias < 0) {
                const mesAnterior = new Date(dataAlvo.getFullYear(), dataAlvo.getMonth(), 0);
                dias += mesAnterior.getDate();
                meses--;
            }
            if (meses < 0) { meses += 12; anos--; }

            let segundos = Math.floor((diferenca % (1000 * 60)) / 1000);

            const totalMeses = (anos * 12) + meses;
            const fmt = (num) => num < 10 ? `0${num}` : num;

            document.getElementById('contadorMeses').innerText = fmt(totalMeses);
            document.getElementById('contadorDias').innerText = fmt(dias);
            document.getElementById('contadorHoras').innerText = fmt(horas);
            document.getElementById('contadorMinutos').innerText = fmt(minutos);
            document.getElementById('contadorSegundos').innerText = fmt(segundos);
        }

        // Inicia e atualiza a cada segundo
        atualizarCronometro();
        setInterval(atualizarCronometro, 1000);


    </script>
</body>
